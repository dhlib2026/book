<style>

p}.grow{flex:1;min-width:160px}label{display:block;font-size:13px;font-weight:600;margin:12px 0 6px}input,select,textarea{width:100%;padding:8px 11px;border:1px solid #d7dfe9;border-radius:7px;background:#fff;color:var(--ink);min-height:38px}input:focus,select:focus,textarea:focus{outline:3px solid #e7efff;border-color:#81a5eb}textarea{min-height:100px;resize:vertical}input[readonly]{background:#f5f7fa}input[type=checkbox]{width:17px;height:17px;min-height:0;accent-color:var(--blue);margin:3px}.groups{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:18px 0}.group{background:#f8fafc;color:#596a82;border:1px solid var(--line);padding:13px 10px;font-size:15px}.group.active{background:#edf3ff;border-color:#6d96e5;color:var(--blue);box-shadow:inset 0 0 0 1px #6d96e5}nav{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0 20px;padding:0 0 10px;border-bottom:1px solid var(--line)}nav button{background:transparent;color:#768399;border:0;padding:8px 15px}nav button.active{background:#e8effc;color:var(--blue)}.badge{display:inline-block;padding:3px 7px;border-radius:5px;background:#edf3ff;color:#4068a4;font-size:11px;font-weight:600;white-space:nowrap}.badge.hold{background:#fff4d9;color:#8c6826}.badge.no{background:#fff0ef;color:#b4554b}.books{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.book{display:flex;gap:18px;border:1px solid var(--line);border-radius:10px;padding:20px;background:#fff}.cover{width:78px;height:114px;object-fit:contain;background:#f3f6fa;border-radius:3px}.bookmain{min-width:0;flex:1}.bookmain h3{font-size:16px}.bookmain p{margin:7px 0;font-size:13px;color:#748095}.bookmain a{color:var(--blue);text-decoration:none}.bookmain button{margin-top:7px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:8px;margin-top:16px}table{width:100%;border-collapse:collapse;min-width:880px}th,td{padding:12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;font-size:13px}th{background:#f7f9fc;color:#63728a;white-space:nowrap;font-size:12px;font-weight:600}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#fbfcff}td.title{min-width:210px;font-weight:600}td small{display:block;color:var(--muted);margin-top:5px;line-height:1.55;font-weight:400}td button{font-size:12px;padding:5px 9px;min-height:30px;margin:0 3px 4px 0}.toolbar{margin:12px 0;gap:7px}.toolbar select,.toolbar input{width:auto;max-width:240px;min-height:35px;padding:6px 10px;font-size:13px}.toolbar button{font-size:13px;min-height:34px;padding:6px 11px}.empty{text-align:center;color:var(--muted);padding:36px}.hidden{display:none!important}dialog{border:1px solid var(--line);border-radius:14px;padding:26px;width:min(540px,94vw);color:var(--ink);max-height:90vh;overflow:auto;box-shadow:0 24px 80px #172b4d30}dialog::backdrop{background:#172b4d65;backdrop-filter:blur(3px)}.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:22px}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);max-width:90vw;z-index:30;background:#243047;color:white;padding:12px 18px;border-radius:8px;white-space:pre-line;box-shadow:0 4px 20px #0002}footer{text-align:center;color:#8994a5;padding:18px;font-size:12px}.summary{background:#f0f5fd;border:1px solid #e0e9fa;border-radius:8px;padding:14px 18px;margin:14px 0;font-weight:600}.consent{background:#fff8e8;padding:12px;border-radius:7px;display:flex;gap:9px;align-items:flex-start;line-height:1.65}.consent input{flex-shrink:0;margin-top:4px}.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}.api-card{background:#fafbfd;border:1px solid var(--line);border-radius:9px;padding:20px}details{font-size:13px;color:#687b96}summary{cursor:pointer}#selectedCount{color:#718097;font-size:12px;padding:0 5px}@media(max-width:720px){.wrap{padding:16px}.card{padding:18px}.groups{grid-template-columns:repeat(4,1fr);gap:6px}.group{font-size:13px;padding:12px 4px}.books,.two{grid-template-columns:1fr}h1{font-size:17px}header .wrap{align-items:flex-start;flex-wrap:wrap;padding:14px 16px}header button{font-size:12px;min-height:32px;padding:5px 9px}.hero{padding:22px}.hero h2{font-size:22px}.book{padding:16px;gap:14px}.cover{width:65px;height:96px}.toolbar{gap:8px}.toolbar button{min-height:38px}dialog{padding:20px}nav button{padding:9px 11px}.hero .badge{white-space:normal}.toolbar input{max-width:100%}}

body{min-height:100vh;display:flex;flex-direction:column}main.wrap{width:100%;flex:1}.hero{padding:20px 26px}.hero h2{font-size:22px}.hero p{margin-bottom:12px}.eyebrow{margin-bottom:7px}.groups{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.group{font-size:14px;padding:8px 18px;min-height:36px}.entry-line{display:flex;align-items:flex-end;gap:14px}#identityFields{flex:1;min-width:0}.start-button{height:42px;min-width:155px;font-size:15px}.entry-line input{height:42px}#entryForm>.muted{margin-bottom:0}#searchPager{justify-content:center;margin:24px 0;gap:18px}#searchPager button{min-width:78px}footer{width:100%;background:#fff;border-top:1px solid var(--line);padding:22px 16px;margin-top:18px;color:var(--ink)}#footerTitle{font-size:18px;font-weight:650;letter-spacing:-.4px}#footerRound{font-size:13px;color:var(--blue);margin-top:6px}@media(max-width:720px){.entry-line{display:block}.start-button{width:100%;margin-top:16px}#identityFields{grid-template-columns:1fr}.group{padding:8px 11px}.hero h2{font-size:20px}#footerTitle{font-size:16px}}

/* 신청자 입력: 가로 라벨 + 세로 두 줄, 오른쪽 시작 버튼 */
#entry{padding:24px;border-radius:18px;background:#fff;border-color:#e2ebf7;box-shadow:0 3px 18px #496d9a08}

#entry .group.active{background:#fff;color:#2876d7;box-shadow:0 3px 12px #40669d12}
#entry .group-icon{width:23px;height:23px;flex:none;color:#829bb9}#entry .group.active .group-icon{color:#3685de}#entry [data-group="학부모"] .group-icon{color:#91b586}

@media(max-width:600px){#entry{padding:16px}#entry .groups{padding:5px;gap:2px;margin-bottom:18px;border-radius:14px}#entry .group{font-size:13px;gap:5px;min-height:40px;padding:7px 4px}#entry .group-icon{width:18px;height:18px}#entry .entry-line{grid-template-columns:minmax(0,1fr) 86px;gap:12px}#entry #identityFields{gap:14px}#entry #identityFields>div{grid-template-columns:48px minmax(0,1fr);gap:7px}#entry #identityFields label{font-size:13px}#entry #identityFields input{height:48px;padding:10px;font-size:16px;border-radius:10px}#entry .start-button{min-height:110px;padding:10px 4px;border-radius:12px;font-size:15px}#entry .start-arrow{font-size:25px}}

/* 관리자 통합 입장 / 목록 안에서만 로딩 표시 */

.section-loading{display:flex;align-items:center;gap:8px;padding:8px 0;font-size:13px}
.section-loading::before{content:'';width:12px;height:12px;border:2px solid #dbe6f7;border-top-color:#4b7be5;border-radius:50%;animation:section-spin .8s linear infinite;flex:none}

<body>
<header><div class="wrap"><h1><a id="homeLink" class="home-link" href="" aria-label="도서관 첫 화면 새로고침">📚 <span id="schoolName">대현고등학교 도서관</span></a></h1><div class="row"><span id="who" class="muted"></span><button class="light" id="leave">사용자 변경</button></div></div></header>
<main class="wrap">
<section class="card hero"><div class="book-art" aria-hidden="true"><i></i><i></i><i></i><i></i><span>BOOKS</span></div><span class="eyebrow">OUR LIBRARY · BOOK WISH</span><h2>한 권의 신청이,<br>우리 도서관의 다음 책이 됩니다.</h2><p>읽고 싶은 책을 찾아, 도서관에 알려주세요.</p><div class="row"><select id="round" class="grow" aria-label="수서 차수"></select><span id="period" class="badge hold"></span></div></section>
<section id="entry" class="card" aria-label="신청자 정보 입력"><div class="groups" id="groups"></div><form id="entryForm"><div class="entry-line"><div id="identityFields" class="two"></div><button class="start-button" type="submit"><span>시작하기</span><span class="start-arrow" aria-hidden="true">→</span></button></div></form></section>
<section id="app" class="hidden"><nav id="nav"></nav><div id="content"></div></section>
</main><footer><div id="footerTitle">📚 도서관 도서 신청</div><div id="footerRound"></div></footer>
<dialog id="modal"><div id="modalContent"></div></dialog><div id="toast" class="hidden" role="status"></div>
<script>
'use strict';
// ====================== 입력할 공개 설정 ======================
const SERVER_URL = 'https://script.google.com/macros/s/AKfycbyl6_mu_YADArit2PlN_fk_qFiAG8J2qIL1c7Y8H57eU8QqxHY-euGHfEvvpxvQzcWw/exec';
// =============================================================
const $ = id => document.getElementById(id);
const S = {
  services: {
    yes: false,
    nl: false
  },
  profile: {
    level: '고등학교',
    gender: '남학생 중심'
  },
  searchSeq: 0,
  categories: [],
  group: '학생',
  user: null,
  token: '',
  tab: '신청',
  rounds: [],
  school: null,
  books: [],
  list: [],
  result: [],
  selected: new Set(),
  page: 1,
  size: 20,
  filter: '전체',
  groupFilter: '전체',
  sort: 'new',
  q: '',
  searchPage: 1,
  searchSource: '예스24',
  searchCategory: '',
  total: 0,
  submissionId: null
};
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({
  '&': '&amp;',
  '<': '&lt;',
  '>': '&gt;',
  '"': '&quot;',
  "'": '&#39;'
} [c]));
const money = v => Number(v || 0).toLocaleString('ko-KR') + '원';
const tag = (v, cls = '') => `<span class="badge ${cls}">${esc(v)}</span>`;
const time = v => v ? new Date(v).toLocaleString('ko-KR', {
  timeZone: 'Asia/Seoul'
}) : '';
let toastTimer;
const pending = new Map();

function toast(s) {
  $('toast').textContent = s;
  $('toast').classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $('toast').classList.add('hidden'), 7000);
}
async function run(fn, trigger) {
  const focused=trigger||document.activeElement;
  const button=focused?.matches?.('button')&&!focused.closest('#nav,#groups')?focused:null;
  if(button?.dataset.running==='true')return null;
  const old=button?.innerHTML,wasDisabled=button?.disabled;
  if(button){button.dataset.running='true';button.disabled=true;button.setAttribute('aria-busy','true');button.innerHTML=fn===doSearch?'검색 중…':'처리 중…';}
  try{return await fn();}
  catch(e){if(!e.superseded){toast(e.message||'처리 실패');const area=document.querySelector('.section-loading');if(area)area.textContent='목록을 불러오지 못했습니다. 메뉴를 다시 선택해 주세요.';}return null;}
  finally{if(button){delete button.dataset.running;button.disabled=wasDisabled;button.removeAttribute('aria-busy');button.innerHTML=old;}}
}

function uuid() {
  return crypto.randomUUID();
}

function api(action, p = {}) {
  const view=S.viewSeq||0,roundId=$('round').value;
  const viewRead=['mine','list','result','settings','categories'].includes(action);
  if (SERVER_URL.includes('여기에_')) return Promise.reject(Error('index 상단 SERVER_URL에 Apps Script 웹앱 주소를 입력하세요.'));
  return new Promise((resolve, reject) => {
    const id = uuid(),
      frame = document.createElement('iframe'),
      form = document.createElement('form');
    frame.name = 'request_' + id;
    frame.hidden = true;
    form.method = 'POST';
    form.action = SERVER_URL;
    form.target = frame.name;
    form.hidden = true;
    const input = document.createElement('input');
    input.name = 'payload';
    input.value = JSON.stringify({
      ...p,
      action,
      id,
      origin: location.origin,
      token: S.token,
      round: $('round').value
    });
    form.append(input);
    document.body.append(frame, form);
    const timer = setTimeout(() => {
      cleanup();
      reject(Error('응답 시간이 초과되었습니다. 신청은 저장됐을 수 있으니 내 신청 확인에서 확인하세요. 재시도할 때는 같은 제출을 유지합니다.'));
    }, 180000);

    function cleanup() {
      clearTimeout(timer);
      pending.delete(id);
      form.remove();
      frame.remove();
    }
    pending.set(id, {
      resolve: v => {
        cleanup();
        if(viewRead&&(view!==(S.viewSeq||0)||roundId!==$('round').value)){const e=Error('화면 변경');e.superseded=true;reject(e);return;}
        if(['submit','candidate','decide','bookPrice','saveResult','recheck','unblock'].includes(action)){S.listRound=null;S.resultRound=null;}
        resolve(v)
      },
      reject: e => {
        cleanup();
        reject(e)
      }
    });
    form.submit();
  });
}
window.addEventListener('message', e => {
  let host;
  try {
    host = new URL(e.origin).hostname;
  } catch {
    return;
  }
  if (!(/(^|[.-])script\.googleusercontent\.com$/.test(host) || host === 'script.google.com')) return;
  const d = e.data;
  if (!d || d.channel !== 'library-app' || !pending.has(d.id)) return;
  const p = pending.get(d.id);
  d.ok ? p.resolve(d.data) : p.reject(Error(d.error));
});

function currentRound() {
  return S.rounds.find(x => x.id === $('round').value);
}

function isOpen() {
  const r = currentRound();
  if (!r) return false;
  const day = new Intl.DateTimeFormat('sv-SE', {
    timeZone: 'Asia/Seoul'
  }).format(new Date());
  return r.enabled === 'true' && day >= r.start && day <= r.end;
}

function setRounds(rs) {
  const prev = $('round').value;
  S.rounds = rs;
  $('round').innerHTML = rs.map(r => `<option value="${esc(r.id)}">${esc(r.year)}학년도 ${esc(r.number)}차</option>`).join('');
  if (rs.some(x => x.id === prev)) $('round').value = prev;
  else {
    const active = rs.find(r => r.enabled === 'true' && new Intl.DateTimeFormat('sv-SE', {
      timeZone: 'Asia/Seoul'
    }).format(new Date()) >= r.start && new Intl.DateTimeFormat('sv-SE', {
      timeZone: 'Asia/Seoul'
    }).format(new Date()) <= r.end);
    if (active) $('round').value = active.id;
  }
  period();
}

function period() {
  updateFooter();
  const r = currentRound();
  $('period').textContent = r ? `${r.start} ~ ${r.end} · ${isOpen()?'접수 중':'접수 전 또는 마감'}` : '관리자가 접수 차수를 설정해야 합니다.';
}

function updateFooter() {
  const r = currentRound(),
    today = new Intl.DateTimeFormat('sv-SE', {
      timeZone: 'Asia/Seoul'
    }).format(new Date());
  $('footerTitle').textContent = (S.profile.footerIcon || '📚') + ' ' + (S.profile.footerText || ((S.school?.name || '학교') + ' 도서관 도서 신청'));
  const state = r ? (isOpen() ? '접수 중' : today < r.start ? '접수 예정' : '접수 마감') : '';
  $('footerRound').textContent = r ? `${r.year}학년도 ${r.number}차 · ${state}` : '접수 차수 준비 중';
}
async function init() {
  const d = await api('init');
  S.school = d.school;
  S.services = d.services || {
    yes: false,
    nl: false
  };
  S.profile = d.profile || S.profile;
  $('schoolName').textContent = d.school.name + ' 도서관';
  setRounds(d.rounds);
}

function entry() {
  const icons={
    '학생':'<path d="M9 5V4a3 3 0 0 1 6 0v1M6 10a6 6 0 0 1 12 0v10H6z"/><path d="M6 13h12M9 16v4M15 16v4"/>',
    '교원':'<path d="M12 6C9 3 5 3 2 4v15c4-1 7-1 10 2 3-3 6-3 10-2V4c-3-1-7-1-10 2v15"/>',

async function doSearch() {
  if (!currentRound()) throw Error('먼저 수서 차수를 설정하세요.');
  const admin = S.tab === '수서',
    source = admin ? $('source').value : '예스24';
  const seq = ++S.searchSeq,
    roundId = $('round').value;
  if (source === '국립중앙도서관' && S.searchMode !== 'recommend') throw Error('국립중앙도서관은 추천 목록 버튼을 이용하세요. 직접 검색은 예스24에서 가능합니다.');
  const d = await api(S.searchMode === 'recommend' ? 'recommend' : 'search', {
    admin,
    source,
    q: $('q').value,
    category: admin ? $('category').value : '',
    type: admin ? $('recType').value : '',
    sex: admin ? $('recSex').value : 'A',
    age: admin ? Number($('recAge').value) : 255,
    page: S.searchPage,
    pageSize: admin && S.searchMode === 'recommend' ? Number($('recommendSize').value) : 4,
    startDate: $('nlStart')?.value,
    endDate: $('nlEnd')?.value
  });
  if (seq !== S.searchSeq || $('round').value !== roundId) return;
  S.books = d.items;
  S.total = d.total;
  S.searchSize = d.pageSize || 4;
  const national = source === '국립중앙도서관',
    isNew = admin && $('recType').value === 'new';
  $('searchContext').textContent = admin && S.searchMode === 'recommend' ? (national ? '국립중앙도서관 사서추천 · 기간·분야 조건' : isNew ? '예스24 신간 · 분야 조건' : `예스24 베스트셀러 · ${$('recAge').value==='10'?'10대':'전체 연령'} · ${{A:'전체 성별',M:'남성',F:'여성'}[$('recSex').value]}`) : '예스24 도서 검색 · 현재 페이지의 모든 유효 ISBN을 확인합니다.';
  drawBooks();
  checkSearchHoldings(seq, roundId, admin);
}

function drawBooks() {
  const admin = S.tab === '수서';
  $('bookResults').innerHTML = S.books.length ? '<div class="books">' + S.books.map((b, i) => {
    const pending = b.holding.state === '확인 중';
    const blocked = (!admin && pending) || (!admin && (b.blocked || (b.holding.state === '소장' && S.user?.group !== '교원') || !isOpen()));
    return `<article class="book">${b.cover?`<img class="cover" src="${esc(b.cover)}" alt="도서 표지" loading="lazy" referrerpolicy="no-referrer">`:'<div class="cover"></div>'}<div class="bookmain"><h3>${esc(b.title)}</h3><p>${esc(b.author)}<br>${esc(b.publisher)} · ${money(b.price)}<br>ISBN ${esc(b.id)}</p><p>${tag(b.holding.state,b.holding.state==='소장'?'no':b.holding.state==='확인 불가'?'hold':'')} ${b.blocked?tag('현재 차수 보류','no'):''}</p>${b.link?`<p><a href="${esc(b.link)}" target="_blank" rel="noopener noreferrer">${esc(b.source)} 도서정보 ↗</a></p>`:''}${b.recommendation?'<details><summary>외부 추천 사유</summary><p>'+esc(b.recommendation)+'</p></details>':''}<button data-book="${i}" ${blocked?'disabled':''}>${pending&&!admin?'소장 확인 중…':admin?'수서 후보 담기':b.blocked?'보류 도서':b.holding.state==='소장'?'수업용 신청':'신청하기'}</button></div></article>`;
  }).join('') + '</div>' : '<div class="card empty">검색 결과가 없습니다.</div>';
  $('bookResults').querySelectorAll('[data-book]').forEach(b => b.onclick = () => bookModal(S.books[Number(b.dataset.book)]));
  $('searchPager').innerHTML = `<button id="prevSearch" ${S.searchPage===1?'disabled':''}>이전</button><span>${S.searchPage}페이지</span><button id="nextSearch" ${S.searchPage*(S.searchSize||5)>=S.total?'disabled':''}>다음</button>`;
  $('prevSearch').onclick = () => {
    S.searchPage--;
    run(doSearch);
  };
  $('nextSearch').onclick = () => {
    S.searchPage++;
    run(doSearch);
  };
}

async function checkSearchHoldings(seq, roundId, admin) {
  const total = new Set(S.books.map(b => b.id)).size;
  const ids = [...new Set(S.books.filter(b => b.holding.state === '확인 중' || (admin && !Number(b.price))).map(b => b.id))];
  let done = total - ids.length;
  if (!ids.length) {
    $('holdingProgress').textContent = S.books.length ? '소장 확인 완료 · 최근 확인 결과 재사용' : '';
    return;
  }
  $('holdingProgress').textContent = `소장 확인 ${done}/${total}종 · 결과를 먼저 보여드리고 있습니다.`;
  for (let i = 0; i < ids.length; i += 10) {
    if (seq !== S.searchSeq || $('round').value !== roundId) return;
    try {
      const d = await api('holdings', {
        isbns: ids.slice(i, i + 10),
        books: S.books.filter(b => ids.slice(i, i + 10).includes(b.id)).map(b => ({
          id: b.id,
          bookToken: b.bookToken
        })),
        admin
      });
      if (seq !== S.searchSeq || $('round').value !== roundId) return;
      S.books.forEach(b => {
        const h = d.holdings.find(h => h.isbn === b.id),
          info = d.books.find(x => x.id === b.id);
        if (h) b.holding = h;
        if (info) {
          b.price = info.price;
          b.cover = b.cover || info.cover;
        }
      });
    } catch (e) {
      if (seq !== S.searchSeq || $('round').value !== roundId) return;
      S.books.filter(b => ids.slice(i, i + 10).includes(b.id)).forEach(b => b.holding = {
        state: '확인 불가'
      });
      toast('일부 소장 확인에 실패했습니다. 신청 시 확인 필요로 접수합니다.');
    }
    done += Math.min(10, ids.length - i);
    drawBooks();
    $('holdingProgress').textContent = `소장 확인 ${done}/${total}종${done===total?' · 완료':''}`;
  }
}

function bookModal(b) {

    if ($('qty').readOnly) $('qty').value = 1;

    $('purpose').onchange = sync;

      $('purpose').value = '수업용';

  }

    const purpose = $('purpose')?.value || '일반',

async function checkBooks(isbns) {
  if (!isbns.length) throw Error('점검할 도서를 선택하세요.');
  let hits = [],
    unknown = [],
    classCount = 0;
  for (let i = 0; i < isbns.length; i += 10) {
    const a = await api('recheck', {
      isbns: isbns.slice(i, i + 10)
    });
    a.forEach(x => {
      if (x.state === '소장') {
        if (x.ids.length) hits.push(x);
        classCount += x.classCount;
      }
      if (x.state === '확인 불가') unknown.push(x.isbn);
    });
  }
  if (hits.length) {
    const ids = hits.flatMap(x => x.ids);
    if (confirm(`소장 도서 ${hits.length}종, 수업용을 제외한 선정 ${ids.length}건이 확인됐습니다.\n해당 선정 건 전체를 '본교 소장' 사유로 보류할까요?\n수업용 ${classCount}건은 선정 상태를 유지합니다.`)) {
      for (let i = 0; i < ids.length; i += 500) await api('decide', {
        ids: ids.slice(i, i + 500),
        status: '보류',
        notice: '본교 소장'
      });
    }
  }
  toast('복본 점검 완료' + (unknown.length ? ' · 확인 불가 ' + unknown.length + '종' : '') + (classCount ? ' · 소장 수업용 ' + classCount + '건 별도 확인' : ''));
  if (S.tab === '결과') await loadResult();
  else await loadList();
}

function download(a, txt) {
  if (!a.length) {
    toast('선정 도서가 없습니다.');
    return;
  }
  if (a.some(x => x.price <= 0)) {
    toast('정가가 없는 도서는 선정 메뉴에서 정가를 입력하세요.');
    return;
  }
  if (a.some(x => !x.reason) && !confirm('선정 이유가 비어 있는 도서가 있습니다. 그대로 다운로드할까요?')) return;
  const r = currentRound(),
    name = S.school.name + '_' + r.year + '학년도_' + r.number + '차_수서결과',
    data = spreadsheetRows(a);
  if (!txt && window.XLSX) {
    const ws = XLSX.utils.aoa_to_sheet(data);
    ws['!cols'] = [{
      wch: 6
    }, {
      wch: 35
    }, {
      wch: 23
    }, {
      wch: 20
    }, {
      wch: 12
    }, {
      wch: 8
    }, {
      wch: 14
    }, {
      wch: 18
    }, {
      wch: 45
    }, {
      wch: 65
    }];
    ws['!autofilter'] = {
      ref: 'A1:J' + (a.length + 1)
    };
    for (let i = 2; i <= a.length + 1; i++) {
      ws['H' + i].t = 's';
      ['E', 'G'].forEach(c => {
        ws[c + i].z = '#,##0';
      });
    }
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, '수서 결과');
    XLSX.writeFile(wb, name + '.xlsx');
    return;
  }
  if (!txt) toast('엑셀 라이브러리를 불러오지 못해 TXT로 다운로드합니다.');
  const clean = v => {
    let s = String(v ?? '').replace(/[\t\r\n]/g, ' ');
    return /^[=+\-@]/.test(s) ? "'" + s : s;
  };
  const blob = new Blob(['\ufeff' + data.map(row => row.map(clean).join('\t')).join('\r\n')], {
    type: 'text/plain;charset=utf-8'
  });
  const url = URL.createObjectURL(blob),
    link = document.createElement('a');
  link.href = url;
  link.download = name + '.txt';
  link.click();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
async function settings() {
  const d = await api('settings');
  $('content').innerHTML = `<section class="card"><h2>학교 설정</h2><label>독서로 학교 검색 링크</label><input id="schoolLink" value="${esc(d.school.link)}"><div class="two"><div><label>학교급</label><select id="schoolLevel">${['초등학교','중학교','고등학교'].map(v=>`<option ${v===d.profile.level?'selected':''}>${v}</option>`).join('')}</select></div><div><label>학생 구성</label><select id="schoolGender">${['남학생 중심','여학생 중심','전체'].map(v=>`<option ${v===d.profile.gender?'selected':''}>${v}</option>`).join('')}</select></div></div><div class="two"><div><label>하단 이모티콘</label><input id="footerIcon" maxlength="20" value="${esc(d.profile.footerIcon||'📚')}"></div><div><label>하단 표시 문구 · 빈칸이면 학교명 자동 사용</label><input id="footerText" maxlength="120" value="${esc(d.profile.footerText||'')}" placeholder="학교명 도서관 도서 신청"></div></div><button id="profileSave" class="light">추천·화면 설정 저장</button><p class="muted">학교 변경 시 이전 기록은 보존되고 학교별로 구분됩니다. 새 학교는 새로운 차수를 설정하세요.</p><div class="row"><button class="light" id="schoolProbe">연결 확인</button><button id="schoolSave">학교 정보 저장</button></div><p id="probeResult" class="muted"></p></section><section class="card"><h2>접수 차수·기간</h2><label>기존 차수 선택 / 신규</label><select id="roundEdit"><option value="">새 차수</option>${d.rounds.map(r=>`<option value="${esc(r.id)}">${r.year}학년도 ${r.number}차</option>`).join('')}</select><div class="two"><div><label>학년도</label><input type="number" id="year" min="2000" max="2100" value="${new Date().getFullYear()}"></div><div><label>차수</label><input type="number" id="roundNumber" min="1" max="99" value="1"></div><div><label>시작일</label><input type="date" id="start"></div><div><label>종료일</label><input type="date" id="end"></div></div><label class="row"><input type="checkbox" id="enabled" checked>접수 허용</label><p class="muted">종료일 한국 시간 23:59:59까지 접수합니다. 같은 학년도·차수를 저장하면 기간과 접수 허용 설정을 수정합니다.</p><button id="roundSave">차수·기간 저장</button></section>${apiCards(d.keys)}`;
  bindApiSettings(d.keys);
  let verified = '';
  $('profileSave').onclick = () => run(async () => {
    await api('saveProfile', {
      level: $('schoolLevel').value,
      gender: $('schoolGender').value,
      footerIcon: $('footerIcon').value,
      footerText: $('footerText').value
    });
    await init();
    toast('추천·화면 설정을 저장했습니다.');
  });
  $('schoolLink').oninput = () => verified = '';
  $('schoolProbe').onclick = () => run(async () => {
    const h = await api('probeSchool', {
      link: $('schoolLink').value
    });
    $('probeResult').textContent = h.state + ' · ' + h.detail;
    if (h.state !== '확인 불가') {
      verified = $('schoolLink').value;
      toast('응답 구조를 확인했습니다. 학교명과 코드를 확인한 뒤 저장하세요.');
    }
  });
  $('schoolSave').onclick = () => run(async () => {
    if (verified !== $('schoolLink').value) throw Error('먼저 연결 확인을 실행하세요.');
    if (!confirm('학교 정보를 변경할까요? 기존 기록은 보존됩니다.')) return;
    await api('saveSchool', {
      link: $('schoolLink').value
    });
    await init();
    S.list = [];
    S.result = [];
    S.books = [];
    await settings();
  });
  $('roundEdit').onchange = () => {
    const r = d.rounds.find(x => x.id === $('roundEdit').value);
    if (r) {
      $('year').value = r.year;
      $('roundNumber').value = r.number;
      $('start').value = r.start;
      $('end').value = r.end;
      $('enabled').checked = r.enabled === 'true';
    }
  };
  $('roundSave').onclick = () => run(async () => {
    await api('saveRound', {
      year: Number($('year').value),
      number: Number($('roundNumber').value),
      start: $('start').value,
      end: $('end').value,
      enabled: $('enabled').checked
    });
    await init();
    toast('접수 설정을 저장했습니다.');
    await settings();
  });
}

function apiCards(keys) {
  return '<section class="card"><h2>API 연결 설정</h2><p class="muted">키 입력 → 연결 확인 → 저장 순서입니다. 국립중앙도서관 승인 전에도 예스24로 운영할 수 있습니다.</p><div class="two">' + keys.map((k, i) => `<div class="api-card"><h3>${esc(k.source)}</h3><p>${tag(k.set?(k.enabled?'연결 설정됨':'사용 중지'):'연결 준비 중',k.set&&k.enabled?'':'hold')}</p><p class="muted">${k.checked?'최근 확인: '+time(k.checked):'아직 연결 확인 기록이 없습니다.'}</p><label for="apiKey${i}">API 키 ${k.set?'· 저장된 키는 원문으로 표시하지 않습니다.':''}</label><input type="password" id="apiKey${i}" maxlength="600" autocomplete="off" placeholder="${k.set?'•••••••• · 변경할 때만 새 키 입력':'발급받은 키를 입력하세요'}"><label class="row"><input type="checkbox" id="apiEnabled${i}" ${k.enabled?'checked':''}>사용</label><div class="row"><button class="light" id="apiProbe${i}">연결 확인</button><button id="apiSave${i}">저장</button>${k.set?'<button class="danger" id="apiRemove'+i+'">연결 해제</button>':''}</div><p id="apiMessage${i}" class="muted" aria-live="polite"></p></div>`).join('') + '</div></section>';
}

function bindApiSettings(keys) {
  keys.forEach((k, i) => {
    let proof = '';
    const input = $('apiKey' + i);
    input.oninput = () => {
      proof = '';
      $('apiMessage' + i).textContent = '키가 변경되었습니다. 연결 확인을 다시 실행하세요.';
    };
    $('apiProbe' + i).onclick = () => run(async () => {
      const d = await api('probeApi', {
        source: k.source,
        key: input.value.trim()
      });
      proof = d.proof;
      $('apiMessage' + i).textContent = d.message + ' 저장 버튼을 눌러 적용하세요.';
    });
    $('apiSave' + i).onclick = () => run(async () => {
      if (!proof) throw Error('먼저 연결 확인을 실행하세요.');
      await api('saveApi', {
        source: k.source,
        key: input.value.trim(),
        proof,
        enabled: $('apiEnabled' + i).checked
      });
      input.value = '';
      proof = '';
      await init();
      await settings();
      toast(k.source + ' 연결 설정을 저장했습니다.');
    });
    if (k.set) $('apiRemove' + i).onclick = () => {
      if (confirm(k.source + ' 연결을 해제하고 저장된 키를 삭제할까요?')) run(async () => {
        await api('removeApi', {
          source: k.source
        });
        await init();
        await settings();
      });
    };
  });
}

$('homeLink').addEventListener('click', (event) => {
  event.preventDefault();
  window.location.reload();
});
entry();
run(init);
</script>
</body>
</html>
